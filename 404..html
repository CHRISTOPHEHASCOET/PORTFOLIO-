<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta name="robots" content="noindex">
  <meta name="description" content="Erreur 404 — Destination introuvable dans le terminal.">

  <title>Vol 404 — Destination introuvable</title>

  <link rel="stylesheet" href="./asset/css/style.css">
  <link rel="stylesheet" href="./asset/css/404.css">
</head>

<body>
  <main class="not-found" id="main-content">
    <section class="not-found__panel" aria-labelledby="error-title">
      <p class="not-found__code">VOL 404</p>

      <h1 id="error-title" class="not-found__title">
        Destination introuvable

      <p class="not-found__text">
        La porte demandée n’existe pas ou le vol a été dérouté.
        Retournez au terminal pour reprendre votre parcours.
      </p>

      <div class="not-found__screen" aria-hidden="true">
        <span>ROUTE ERROR</span>
        <span>GATE UNKNOWN</span>
        <span>STATUS : LOST SIGNAL</span>
      </div>

      <nav class="not-found__actions" aria-label="Navigation d’erreur">
        <a href="index.html" class="not-found__button not-found__button--primary">
          Retour au terminal
        </a>
        <a href="contact.html" class="not-found__button">
          Contacter la tour
        </a>
      </nav>
    </section>
  </main>

</html>
